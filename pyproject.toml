[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wtcraft"
version = "0.3.4"
description = "Budget-Aware Multi-Agent Coding Harness for git-native worktrees"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
keywords = ["git", "worktree", "agents", "orchestration", "multi-agent", "claude", "codex"]
readme = "README.md"
authors = [
  { name = "Victor Zhang", email = "zywkloo@icloud.com" }
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Topic :: Software Development",
  "Topic :: Software Development :: Version Control :: Git",
  "Topic :: Utilities",
]

[project.urls]
Repository  = "https://github.com/zywkloo/wtcraft"
Issues      = "https://github.com/zywkloo/wtcraft/issues"
Changelog   = "https://github.com/zywkloo/wtcraft/blob/main/CHANGELOG.md"
Homepage    = "https://github.com/zywkloo/wtcraft#readme"

[project.scripts]
wtcraft = "wtcraft._cli:main"

# ── package discovery ────────────────────────────────────────────────────────
[tool.setuptools.packages.find]
where = ["src"]

# Explicitly list every bundled data file.
# Setuptools skips hidden files/dirs by default, so we name them directly.
[tool.setuptools.package-data]
wtcraft = [
  "_shell.sh",
  "templates/.agent-harness/planner.md",
  "templates/.agent-harness/executor.md",
  "templates/.agent-harness/finisher.md",
  "templates/.claude/commands/planwt.md",
  "templates/.claude/commands/finishwt.md",
  "templates/worktrees/.worktree-task.md",
]
