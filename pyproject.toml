[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wtcraft"
version = "0.4.1"
description = "A lightweight, git-native scaffolding for bounded multi-agent coding"
license = { text = "Apache-2.0" }
requires-python = ">=3.7"
keywords = [
  "git",
  "worktree",
  "agent",
  "agents",
  "ai",
  "llm",
  "harness",
  "cli",
  "code",
  "coding",
  "claude",
  "codex",
  "budget",
  "sandbox",
  "token"
]
readme = "README.md"
authors = [
  { name = "Victor Zhang", email = "zywkloo@icloud.com" }
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Topic :: Software Development",
  "Topic :: Software Development :: Version Control :: Git",
  "Topic :: Utilities",
]

[project.urls]
Repository  = "https://github.com/zywkloo/wtcraft"
Issues      = "https://github.com/zywkloo/wtcraft/issues"
Changelog   = "https://github.com/zywkloo/wtcraft/blob/main/CHANGELOG.md"
Homepage    = "https://github.com/zywkloo/wtcraft#readme"

[project.scripts]
wtcraft = "wtcraft._cli:main"
wtc = "wtcraft._cli:main"

# ── package discovery ────────────────────────────────────────────────────────
[tool.setuptools.packages.find]
where = ["src"]

# Explicitly list every bundled data file.
# Setuptools skips hidden files/dirs by default, so we name them directly.
[tool.setuptools.package-data]
wtcraft = [
  "_shell.sh",
  "templates/.agent-harness/planner.md",
  "templates/.agent-harness/executor.md",
  "templates/.agent-harness/finisher.md",
  "templates/.agent-harness/role-models.yml",
  "templates/.agent-harness/task-states.md",
  "templates/.agent-harness/llm-anti-patterns.md",
  "templates/.claude/commands/planwt.md",
  "templates/.claude/commands/finishwt.md",
  "templates/.claude/commands/statuswt.md",
  "templates/.agent-harness/presets/preset-balanced.yml",
  "templates/.agent-harness/presets/preset-anthropic.yml",
  "templates/.agent-harness/presets/preset-openai.yml",
  "templates/.agent-harness/presets/preset-google.yml",
  "templates/worktrees/.worktree-task.md",
]
