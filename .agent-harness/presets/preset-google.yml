# Role-to-CLI routing for wtcraft agent roles. (STOT)
#
# Quick start: copy a preset from .agent-harness/presets/ over this file
# to switch to a provider-optimized configuration:
#   cp .agent-harness/presets/preset-anthropic.yml .agent-harness/role-models.yml
#
# Schema (all values are single-line scalars — no YAML arrays or nested objects,
#         making every field extractable with simple awk/grep key: value matching):
#   cli      — binary to invoke (claude / codex / gemini). Primary routing key.
#   model    — hint only: used when an API key is available; subscription CLIs
#              use whatever their plan provides. Version is the trailing number.
#   fallback — comma-separated, ordered left-to-right (left = higher priority).
#              Each entry is `cli:Model Name Version`.
#
# Matching rules (top-level constraints, enforced by agents and tooling):
matching:
  fuzzy: true              # normalize spaces, dashes, underscores, case
                           # "claude-opus-4.8" == "Claude Opus 4.8" == "claudeopus4.8"
  freshness_tolerance: 0.2 # max version gap within the same model family to count
                           # as a hit: primary 4.8 → 4.7 hits, 4.6 does not

roles:

  orchestrator:
    cli: gemini
    model: Gemini 3.5 Flash
    fallback: claude:Claude Sonnet 4.6, codex:GPT-5.4
    rationale: low-latency, tool-heavy, cross-repo coordination

  planner:
    cli: gemini
    model: Gemini Pro 3.1
    fallback: claude:Claude Opus 4.8, codex:GPT-5.5
    rationale: high-reasoning, session-based strategic planning

  executor:
    cli: gemini
    model: Gemini Pro 3.1
    fallback: codex:GPT-5.4, claude:Claude Sonnet 4.6
    rationale: focused coder, budget-friendly, sandboxed worktree

  verifier:
    cli: gemini
    model: Gemini Pro 3.1
    fallback: claude:Claude Opus Fable 5, claude:Claude Opus 4.8, codex:GPT-5.5
    rationale: code review, security/style checks, PR-level gating

  finisher:
    cli: gemini
    model: Gemini Flash 3.5
    fallback: claude:Claude Haiku 4.5, codex:GPT-5.4-Mini
    rationale: worktree and local branch cleanup runner
