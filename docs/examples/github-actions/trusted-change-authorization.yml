# Copy this file to .github/workflows/wtcraft-trusted-change.yml only after
# protecting refs/heads/wtcraft-policy and reviewing the setup guide.
#
# This job intentionally runs trusted base-branch code only. Do not add an
# untrusted PR checkout, dependency install, build, cache restore, or secret to
# this pull_request_target job.
name: wtcraft trusted change authorization

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  authorize:
    name: wtcraft / trusted-change-authorization
    runs-on: ubuntu-latest
    steps:
      - name: Reject fork pull requests in the v0.5 prototype
        if: github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "wtcraft v0.5 accepts same-repository pull requests only." >&2
          exit 1

      # pull_request_target uses the target repository's workflow context.
      # Pin the checkout to the target/base commit so this script is not read
      # from the pull request under review.
      - name: Checkout trusted base revision
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1

      - name: Fetch policy and pull request head without checking out PR code
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git fetch --no-tags origin \
            "+refs/heads/wtcraft-policy:refs/heads/wtcraft-policy" \
            "+refs/pull/${PR_NUMBER}/head:refs/heads/wtcraft-pr-head"

      - name: Evaluate trusted authorization
        env:
          REPOSITORY: ${{ github.repository }}
          HEAD_REF: refs/heads/${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 scripts/policy_git_adapter.py \
            --repo . \
            --repository "${REPOSITORY}" \
            --head-ref "${HEAD_REF}" \
            --head-sha "${HEAD_SHA}" \
            --base-sha "${BASE_SHA}" \
            --policy-ref refs/heads/wtcraft-policy \
            > wtcraft-policy-evidence.json
          cat wtcraft-policy-evidence.json
