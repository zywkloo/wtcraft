# Installed by `wtcraft init-ci`. Do not enable this as a required check until
# refs/heads/wtcraft-policy is protected and the setup steps the command
# printed are complete.
#
# This job intentionally runs trusted base-branch code only. Do not add an
# untrusted PR checkout, dependency install, build, cache restore, or secret to
# this pull_request_target job.
name: wtcraft trusted change authorization

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  authorize:
    name: wtcraft / trusted-change-authorization
    runs-on: ubuntu-latest
    steps:
      - name: Reject fork pull requests in the v0.5 prototype
        if: github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "wtcraft v0.5 accepts same-repository pull requests only." >&2
          exit 1

      # pull_request_target uses the target repository's workflow context.
      # Pin the checkout to the target/base commit so the adapter is not read
      # from the pull request under review, and pin the action itself by commit
      # SHA before making this check required.
      #
      # fetch-depth: 0 is required, not a convenience. The adapter computes the
      # merge base between the base tip and the PR head; on a shallow clone the
      # fork point sits behind the graft boundary and git cannot answer, which
      # fails every PR whose base branch has advanced since it was opened.
      - name: Checkout trusted base revision
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0

      - name: Fetch policy and pull request head without checking out PR code
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git fetch --no-tags origin \
            "+refs/heads/wtcraft-policy:refs/heads/wtcraft-policy" \
            "+refs/pull/${PR_NUMBER}/head:refs/heads/wtcraft-pr-head"

      - name: Evaluate trusted authorization
        env:
          REPOSITORY: ${{ github.repository }}
          HEAD_REF: refs/heads/${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Capture the exit code instead of letting `set -e` abort here. A
          # denial exits non-zero, and aborting would discard the evidence in
          # exactly the case a reviewer needs to read it.
          set +e
          python3 .wtcraft/policy_git_adapter.py \
            --repo . \
            --repository "${REPOSITORY}" \
            --head-ref "${HEAD_REF}" \
            --head-sha "${HEAD_SHA}" \
            --base-sha "${BASE_SHA}" \
            --policy-ref refs/heads/wtcraft-policy \
            > wtcraft-policy-evidence.json
          status=$?
          set -e
          cat wtcraft-policy-evidence.json
          exit "${status}"

      - name: Publish authorization evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wtcraft-policy-evidence
          path: wtcraft-policy-evidence.json
          if-no-files-found: warn
