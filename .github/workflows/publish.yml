name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:   # allow manual trigger from GitHub Actions UI

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required for OIDC trusted publisher
      contents: write   # required to create GitHub Release

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build
        run: pip install build

      - name: Build sdist and wheel
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ github.ref_name }}"
          version="${tag#v}"

          # CHANGELOG.md is the single source of truth for release notes.
          # Extract this version's section (everything between its header and
          # the next "## [" header).
          notes="$(awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { grab=1; next }
            grab && /^## \[/ { exit }
            grab { print }
          ' CHANGELOG.md)"

          # Idempotent: skip if the release already exists (e.g. it was created
          # by hand before pushing the tag) instead of failing on a duplicate.
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; skipping."
          elif [ -n "$(printf '%s' "$notes" | tr -d '[:space:]')" ]; then
            echo "Using CHANGELOG.md section for $version."
            gh release create "$tag" --title "$tag" --notes "$notes"
          else
            echo "No CHANGELOG.md section for $version; falling back to generated notes."
            gh release create "$tag" --title "$tag" --generate-notes
          fi
